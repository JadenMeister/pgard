<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 990 990">
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
 <!-- open scanning ring: two openings, clean geometric curves -->
 <path d="M 225 574 C 207 532 204 481 223 439 C 245 392 292 363 347 360 C 408 355 471 386 506 437 C 532 475 540 519 521 559 C 485 634 393 681 303 634"
       stroke="#111A27" stroke-width="6.0" />
 <!-- diagonal magnifier handle, not joined to the ring -->
 <path d="M 270 590 L 110 735" stroke="#111A27" stroke-width="6.2" />
</g>
<!-- Responsive counter-attack / guard silhouette: pointed variable-width strokes -->
<g fill="#111A27">
 <!-- curved alert/deflection stroke -->
 <path d="M 393 295 C 468 299 532 325 582 370 C 616 401 625 425 603 464 C 591 484 578 497 562 506 C 579 472 594 445 596 419 C 595 371 508 314 393 295 Z"/>
 <!-- upper small strike -->
 <path d="M 616 285 C 622 262 647 239 671 213 C 653 253 632 287 612 328 Z"/>
 <!-- long spear-shaped attack vector -->
 <path d="M 648 352 C 721 277 798 208 864 155 C 812 222 718 314 647 363 Z"/>
 <!-- secondary thrust echo, a tapered stroke rather than a decorative lightning cluster -->
 <path d="M 598 492 C 649 428 713 360 793 305 C 740 364 660 446 598 492 Z"/>
 <!-- bold angular obstruction/arrow on the right: sharp edge and guarded retreat -->
 <path d="M 599 518 L 766 496 C 748 549 707 621 649 691 C 611 737 585 757 562 771 C 630 679 701 582 731 519 Z"/>
 <!-- lower deflection line: breaks incoming force outward instead of penetrating lens -->
 <path d="M 425 690 L 493 659 L 459 695 C 489 735 574 821 637 865 C 558 824 465 751 425 690 Z"/>
</g>
</svg>