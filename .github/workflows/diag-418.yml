name: diag-418

on:
  pull_request:

permissions:
  contents: read

jobs:
  group:
    name: ${{ matrix.g.name }} (${{ matrix.n }})
    runs-on: macos-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2]
        g:
          - { name: analyzer-hash, paths: "packages/scan-core/src/analyzer-hash.test.ts" }
          - { name: code-analyzer, paths: "packages/scan-core/src/code-analyzer.test.ts" }
          - { name: default-analyzers, paths: "packages/scan-core/src/default-analyzers.test.ts" }
          - {
              name: incremental-equivalence,
              paths: "packages/scan-core/src/incremental-equivalence.test.ts",
            }
          - { name: paths, paths: "packages/scan-core/src/paths.test.ts" }
          - { name: project-config, paths: "packages/scan-core/src/project-config.test.ts" }
          - { name: rule-locality, paths: "packages/scan-core/src/rule-locality.test.ts" }
          - {
              name: run-scan-expected-repo,
              paths: "packages/scan-core/src/run-scan-expected-repo.test.ts",
            }
          - { name: run-scan, paths: "packages/scan-core/src/run-scan.test.ts" }
          - { name: staged-scan, paths: "packages/scan-core/src/staged-scan.test.ts" }
          - {
              name: standards-coverage-real,
              paths: "packages/scan-core/src/standards-coverage-real.test.ts",
            }
          - { name: standards-coverage, paths: "packages/scan-core/src/standards-coverage.test.ts" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx vitest run ${{ matrix.g.paths }}
