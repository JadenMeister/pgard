name: diag-418

on:
  pull_request:

permissions:
  contents: read

jobs:
  group:
    name: ${{ matrix.g.name }} (${{ matrix.n }})
    runs-on: macos-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4, 5, 6]
        g:
          - {
              name: no-incr,
              paths: "packages/scan-core --exclude packages/scan-core/src/incremental-equivalence.test.ts --exclude node_modules/**",
            }
          - {
              name: incr-plus,
              paths: "packages/scan-core/src/incremental-equivalence packages/scan-core/src/project-config packages/scan-core/src/run-scan",
            }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: bash scripts/diag-418-run.sh ${{ matrix.g.paths }}
