name: diag-418

on:
  pull_request:

permissions:
  contents: read

jobs:
  group:
    name: ${{ matrix.g.name }} (${{ matrix.n }})
    runs-on: macos-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4, 5, 6, 7, 8]
        g:
          - {
              name: big,
              paths: "packages/scan-core/src/staged-scan.test.ts -t 'is partial, not clean'",
            }
          - {
              name: unreadable,
              paths: "packages/scan-core/src/staged-scan.test.ts -t 'unreadable repository'",
            }
          - {
              name: cap,
              paths: "packages/scan-core/src/staged-scan.test.ts -t 'exhausted time cap'",
            }
          - {
              name: cancel,
              paths: "packages/scan-core/src/staged-scan.test.ts -t 'rethrows a cancellation'",
            }
          - {
              name: rest,
              paths: "packages/scan-core/src/staged-scan.test.ts -t 'reports a secret|does not report|reads staged|applies the exclude|does not count'",
            }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: bash scripts/diag-418-run.sh ${{ matrix.g.paths }}
