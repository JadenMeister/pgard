name: diag-418

on:
  pull_request:

permissions:
  contents: read

jobs:
  group:
    name: ${{ matrix.g.name }} (${{ matrix.n }})
    runs-on: macos-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3]
        g:
          - { name: deps, paths: "packages/dependencies" }
          - { name: scancore, paths: "packages/scan-core" }
          - { name: hist-iso, paths: "git-history/src/isolation git-history/src/preflight" }
          - {
              name: hist-run,
              paths: "git-history/src/run-git git-history/src/git-executable git-history/src/safe-read git-history/src/hook-paths git-history/src/remote",
            }
          - {
              name: hist-incr,
              paths: "git-history/src/scan-history-incremental git-history/src/scan-history-limits",
            }
          - {
              name: hist-rest,
              paths: "git-history/src/scan-history.test git-history/src/string-regions git-history/src/secret-patterns git-history/src/staged git-history/src/rule-stats git-history/src/dependency-directories",
            }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx vitest run ${{ matrix.g.paths }}
