name: release

# Publishes the single npm package `pgard`. It never runs on push to a branch or on a pull
# request: only on a version tag or by hand. The publish job waits for a manual approval (the
# required reviewers of the `npm-publish` environment) and authenticates to npm with npm trusted
# publishing (OIDC), so no npm token is stored anywhere. See docs/RELEASING.md.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release; must equal the version in packaging/pgard/package.json (for example 0.1.0, without v)"
        required: true
        type: string
      dry_run:
        description: "Verify and run `npm publish --dry-run` only (nothing reaches the registry)"
        required: true
        type: boolean
        default: true
  push:
    tags: ["v*.*.*"]

# Nothing by default; each job asks for exactly what it needs.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tarball: ${{ steps.pack.outputs.tarball }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          # No dependency cache in a release job (cache poisoning).
          package-manager-cache: false
      # The released commit must be on main, and a real publish needs a tag.
      - name: Check the released commit and the run mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$REF_TYPE" != "tag" ] && [ "$DRY_RUN_INPUT" != "true" ]; then
            echo "::error::a dispatch on a branch may only be a dry run; real releases come from a tag"; exit 1
          fi
          git fetch --no-tags --depth=1000 origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_SHA is not on main"; exit 1; }
      # The tag (or the dispatch input) must name exactly the version that is about to be packed.
      - name: Check the requested version against the package
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          pkg=$(node -p 'require("./packaging/pgard/package.json").version')
          code=$(node -p 'require("fs").readFileSync("packages/scan-core/src/version.ts","utf8").match(/PGARD_VERSION = "([^"]+)"/)[1]')
          if [ "$EVENT_NAME" = "push" ]; then
            [ "$REF_TYPE" = "tag" ] || { echo "::error::a push release must be a tag"; exit 1; }
            requested="${REF_NAME#v}"
            [ "v$requested" = "$REF_NAME" ] || { echo "::error::tag $REF_NAME must start with v"; exit 1; }
          else
            requested="$INPUT_VERSION"
          fi
          if ! printf '%s' "$requested" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$requested' is not a semantic version"; exit 1
          fi
          if [ "$requested" != "$pkg" ]; then
            echo "::error::requested version $requested != packaging/pgard/package.json version $pkg"; exit 1
          fi
          if [ "$pkg" != "$code" ]; then
            echo "::error::package version $pkg != PGARD_VERSION $code"; exit 1
          fi
          echo "version=$pkg" >> "$GITHUB_OUTPUT"
      # No dependency lifecycle scripts run in the release job. esbuild's platform binary comes
      # from an optional dependency, so it needs no install script; the next step proves it runs.
      - run: npm ci --ignore-scripts
      - name: esbuild binary runs
        run: npx esbuild --version
      - name: Analyzer hash is committed
        run: node scripts/analyzer-hash.mjs --check
      - run: npm run build
      - run: npm run typecheck
      - run: npm run typecheck:tests
      - run: npm run format:check
      - run: npm test
      - run: npm run corpus:check
      - run: npm run pack:pgard
      - run: npm run smoke:pack
      # upload-artifact skips hidden directories such as .pack, so the tarball is copied to a
      # visible directory first.
      - name: Locate the tarball
        id: pack
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          file=".pack/pgard-${VERSION}.tgz"
          [ -f "$file" ] || { echo "::error::$file was not produced"; exit 1; }
          found=(.pack/pgard-*.tgz)
          [ "${#found[@]}" -eq 1 ] || { echo "::error::expected exactly one tarball"; exit 1; }
          mkdir release-tarball
          cp "$file" release-tarball/
          echo "tarball=pgard-${VERSION}.tgz" >> "$GITHUB_OUTPUT"
          sha256=$(sha256sum "$file" | cut -d' ' -f1)
          echo "sha256=${sha256}" >> "$GITHUB_OUTPUT"
          # Recorded so the owner can compare it later (packaging/homebrew/update-formula.sh).
          echo "Tarball \`pgard-${VERSION}.tgz\` built by the verify job, sha256: \`${sha256}\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pgard-tarball
          path: release-tarball/pgard-*.tgz
          if-no-files-found: error
          retention-days: 30

  publish:
    name: publish to npm
    needs: verify
    # Only from main or from a version tag, never from another branch.
    if: ${{ github.repository == 'JadenMeister/pgard' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-latest
    # The environment's required reviewers are the manual approval. It must be configured by the
    # repository owner (docs/RELEASING.md); without it nothing here is protected, see the notes there.
    environment: npm-publish
    permissions:
      id-token: write # OIDC token for npm trusted publishing and the provenance statement
      contents: read
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pgard-tarball
          path: tarball
      - name: Publish the verified tarball
        env:
          TARBALL: ${{ needs.verify.outputs.tarball }}
          EXPECTED_SHA256: ${{ needs.verify.outputs.sha256 }}
          VERSION: ${{ needs.verify.outputs.version }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          set -euo pipefail
          # A leading "./" keeps npm from reading "tarball/x.tgz" as a GitHub "owner/repo" spec.
          file="./tarball/${TARBALL}"
          actual=$(sha256sum "$file" | cut -d' ' -f1)
          [ "$actual" = "$EXPECTED_SHA256" ] || { echo "::error::tarball changed after verify"; exit 1; }
          # The bytes about to be published (compare with the verify job's value and with
          # EXPECTED_SHA256 in packaging/homebrew/update-formula.sh).
          echo "Tarball \`${TARBALL}\` published by the publish job, sha256: \`${actual}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "sha256 of the tarball to publish: ${actual}"
          # A pre-release version never becomes `latest`.
          tag=latest
          case "$VERSION" in *-*) tag=next ;; esac
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: nothing is published."
            npm publish "$file" --access public --tag "$tag" --dry-run
          else
            # No NODE_AUTH_TOKEN: npm authenticates with the OIDC token (trusted publishing) and
            # attaches the provenance statement. Without a trusted publisher configured on
            # npmjs.com this fails and publishes nothing.
            npm publish "$file" --provenance --access public --tag "$tag"
          fi

  # Publishes the same verified tarball to GitHub Packages as `@jadenmeister/pgard` (GitHub
  # Packages npm packages must be scoped to the owner). It runs only after the npmjs.com publish
  # succeeded and behind the same `npm-publish` approval. Only `name` and `publishConfig` (registry
  # added, provenance dropped) of package.json change; every other file is checked to be identical to the verified tarball.
  publish-github:
    name: publish to GitHub Packages
    needs: [verify, publish]
    if: ${{ github.repository == 'JadenMeister/pgard' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      packages: write # publish with GITHUB_TOKEN
      id-token: write # OIDC token for the build provenance attestation
      attestations: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          package-manager-cache: false
          registry-url: https://npm.pkg.github.com
          scope: "@jadenmeister"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pgard-tarball
          path: tarball
      - name: Repack the verified tarball as @jadenmeister/pgard
        id: repack
        env:
          TARBALL: ${{ needs.verify.outputs.tarball }}
          EXPECTED_SHA256: ${{ needs.verify.outputs.sha256 }}
        run: |
          set -euo pipefail
          orig="./tarball/${TARBALL}"
          actual=$(sha256sum "$orig" | cut -d' ' -f1)
          [ "$actual" = "$EXPECTED_SHA256" ] || { echo "::error::tarball changed after verify"; exit 1; }
          # The integrity value npm shows for the npmjs.com copy (sha512, base64).
          integrity="sha512-$(openssl dgst -sha512 -binary "$orig" | base64 -w0)"
          echo "Verified tarball \`${TARBALL}\` sha256: \`${actual}\`, integrity: \`${integrity}\`" >> "$GITHUB_STEP_SUMMARY"
          work="$RUNNER_TEMP/ghpkg"
          mkdir -p "$work/orig" "$work/new" "$work/out" "$work/check"
          tar -xzf "$orig" -C "$work/orig"
          cp -R "$work/orig/package" "$work/new/package"
          # The only edits: the package name, the registry, and dropping publishConfig.provenance (npm
          # provenance is npmjs.com-only and publishConfig would override the CLI flag). The GitHub copy's
          # provenance is the attestation below.
          node -e '
            const fs = require("fs");
            const p = process.argv[1];
            const m = JSON.parse(fs.readFileSync(p, "utf8"));
            if (m.name !== "pgard") throw new Error("unexpected package name " + m.name);
            m.name = "@jadenmeister/pgard";
            const { provenance, ...rest } = m.publishConfig ?? {};
            m.publishConfig = { ...rest, registry: "https://npm.pkg.github.com" };
            fs.writeFileSync(p, JSON.stringify(m, null, 2) + "\n");
          ' "$work/new/package/package.json"
          (cd "$work/out" && npm pack "$work/new/package" --ignore-scripts --silent >/dev/null)
          out=("$work"/out/*.tgz)
          [ "${#out[@]}" -eq 1 ] || { echo "::error::expected exactly one repacked tarball"; exit 1; }
          tar -xzf "${out[0]}" -C "$work/check"
          # Same entries and modes (from the tar headers), and the same sha256 for every file except
          # package/package.json. This job runs on ubuntu-latest (Linux): GNU tar and find.
          headers() { tar -tvzf "$1" | awk '{ n = $6; for (i = 7; i <= NF; i++) n = n " " $i; print $1, n }' | sort; }
          sums() { (cd "$1" && find . -type f ! -path ./package/package.json -exec sha256sum {} + | sort -k2); }
          diff <(headers "$orig") <(headers "${out[0]}") || { echo "::error::repacked file list or modes differ from the verified tarball"; exit 1; }
          diff <(sums "$work/orig") <(sums "$work/check") || { echo "::error::repacked files differ from the verified tarball"; exit 1; }
          # package.json differs from the verified one in exactly the name, the registry and the removed
          # publishConfig.provenance.
          node -e '
            const fs = require("fs");
            const { isDeepStrictEqual } = require("util");
            const read = (d) => JSON.parse(fs.readFileSync(d + "/package/package.json", "utf8"));
            const a = read(process.argv[1]);
            const b = read(process.argv[2]);
            a.name = "@jadenmeister/pgard";
            const { provenance, ...rest } = a.publishConfig ?? {};
            a.publishConfig = { ...rest, registry: "https://npm.pkg.github.com" };
            if (!isDeepStrictEqual(a, b)) throw new Error("package.json differs in more than name, publishConfig.registry and publishConfig.provenance");
          ' "$work/orig" "$work/check"
          mkdir release-github
          cp "${out[0]}" release-github/
          file="release-github/$(basename "${out[0]}")"
          echo "file=${file}" >> "$GITHUB_OUTPUT"
          # sha512 integrity of the repacked tarball (npm pack is deterministic for the same input).
          echo "integrity=sha512-$(openssl dgst -sha512 -binary "$file" | base64 -w0)" >> "$GITHUB_OUTPUT"
          echo "Repacked tarball \`$(basename "$file")\` sha256: \`$(sha256sum "$file" | cut -d' ' -f1)\` (only package.json differs from the verified tarball)" >> "$GITHUB_STEP_SUMMARY"
      # A re-run after a failure at the end of this job must be able to finish: if the version is
      # already on GitHub Packages with exactly the repacked tarball's integrity, skip the publish
      # and still attest. A different integrity fails closed; a version is never replaced.
      - name: Check whether the version is already on GitHub Packages
        id: exists
        env:
          # setup-node wrote an .npmrc that reads this variable.
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.verify.outputs.version }}
          INTEGRITY: ${{ steps.repack.outputs.integrity }}
        run: |
          set -euo pipefail
          status=0
          out=$(npm view "@jadenmeister/pgard@${VERSION}" dist.integrity --registry https://npm.pkg.github.com 2>&1) || status=$?
          if [ "$status" -eq 0 ] && [ -n "$out" ]; then
            if [ "$out" = "$INTEGRITY" ]; then
              echo "@jadenmeister/pgard@${VERSION} is already on GitHub Packages with the same integrity; skipping the publish."
              echo "published=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::@jadenmeister/pgard@${VERSION} exists on GitHub Packages with a different integrity ($out, expected $INTEGRITY); nothing is published. A published version cannot be replaced: release a new version."
            exit 1
          fi
          if ! printf '%s' "$out" | grep -q 'E404'; then
            echo "::error::could not tell whether @jadenmeister/pgard@${VERSION} exists on GitHub Packages: $out"
            exit 1
          fi
          echo "@jadenmeister/pgard@${VERSION} is not on GitHub Packages yet."
          echo "published=false" >> "$GITHUB_OUTPUT"
      - name: Publish to GitHub Packages
        if: ${{ steps.exists.outputs.published != 'true' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FILE: ${{ steps.repack.outputs.file }}
          VERSION: ${{ needs.verify.outputs.version }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          set -euo pipefail
          # A pre-release version never becomes `latest`.
          tag=latest
          case "$VERSION" in *-*) tag=next ;; esac
          # The attestation below is the provenance of this copy; npm's own is for npmjs.com.
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: nothing is published."
            npm publish "./$FILE" --tag "$tag" --provenance=false --ignore-scripts --dry-run
          else
            npm publish "./$FILE" --tag "$tag" --provenance=false --ignore-scripts
          fi
      - name: Attest build provenance of the GitHub Packages tarball
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.repack.outputs.file }}
