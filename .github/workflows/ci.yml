name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npm run build
      # Integration tests resolve sources, so only this runs the built dist. Both commands are
      # local: no network and no GitHub sign-in.
      - name: Smoke-test the built CLI
        run: |
          node apps/cli/dist/bin/pgard.js --help
          node apps/cli/dist/bin/pgard.js rules list
      - run: npm run typecheck:tests
      - run: npm run format:check
      - run: npm test
