name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check-os:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npm run build
      # Integration tests resolve sources, so only this runs the built dist. Both commands are
      # local: no network and no GitHub sign-in.
      - name: Smoke-test the built CLI
        run: |
          node apps/cli/dist/bin/pgard.js --help
          node apps/cli/dist/bin/pgard.js rules list
      - run: npm run typecheck:tests
      - run: npm run format:check
      - run: npm test
      # Real Windows Credential Manager round trip with a random throwaway service name.
      - name: Keychain round trip (Windows)
        if: runner.os == 'Windows'
        env:
          PGARD_KEYCHAIN_CI: "1"
        run: npx vitest run packages/github-auth/src/os-keychain.ci.test.ts

  # Builds the single `pgard` package, installs the tarball into a temporary prefix and runs it
  # (version, help, rules, doctor, Korean PDF font, all four tree-sitter grammars and a corrupted-grammar
  # refusal, shrinkwrap tree, dashboard server). The install prefix contains a space on purpose, so
  # the Windows run covers paths with spaces. Nothing is published. `pgard doctor` needs no sign-in and always exits 0, reporting state instead.
  pack-smoke:
    name: pack smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npm run pack:pgard
      - run: npm run smoke:pack

  # Branch protection requires a check named `check`. This job keeps that name and passes only
  # when every OS in the matrix passed (`always()` so a failed matrix cannot leave it skipped).
  check:
    name: check
    needs: [check-os, pack-smoke]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every OS to pass
        run: |
          if [ "${{ needs.check-os.result }}" != "success" ] || [ "${{ needs.pack-smoke.result }}" != "success" ]; then
            echo "check-os result: ${{ needs.check-os.result }}"
            echo "pack-smoke result: ${{ needs.pack-smoke.result }}"
            exit 1
          fi
